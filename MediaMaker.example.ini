[ToolTipText]
description=Description of settings in this profile
scale=Target video screen size in format width:height
sws_flags=Use this ffmpeg scaling algorithm; see https://ffmpeg.org/ffmpeg-scaler.html#Scaler-Options
fps=Target frame rate (frames per second); format must be exactly ##.###
bv=Target video bitrate (quality); don't forget the "k" suffix!
acodec_in=Name of audio codec to be used when extracting the audio track from the source file(s)
acodec_out=Name of audio codec to be used in the target output file
ar=Target audio resampling rate (usually 44100 or 48000)
ba=Target audio bitrate (quality); don't forget the "k" suffix!
crop=Remove this many pixels at top and bottom of source video frame; usually in the range of 60 to 74
floor=Seek next earlier keyframe in this many seconds; should be 1 (or maybe 2)
blackness=RGB-related value below which non-black pixels will be considered black (RGB=0) during auto-cropping
allowance=During auto-cropping, max. number of non-black pixels allowed in one scanline to be still considered black
pad=on = source videos are padded with (minimal) black border(s) to fit the target scale; off = they are stretched to the target scale
audio=Use nth detected audio stream (language); should be 1 unless (optionally) for multilanguage DVD
pause=Min. length (in seconds) of pause caused by commercials in between movie segments (for TV recordings)
detect=Detect audio streams after moving n milliseconds into the source file; useful for streamed recordings (.ts)
aflags=Flags for ffmpeg when extracting audio (like +igndts+genpts); useful when audio is broken
tolerance=Seeking with the black border: tolerance in scanlines when comparing the detected border with the crop value
step_end=Seeking the end of a commercial: initial step width in seconds (refined by factor 10 down to single frames)
step_next=Seeking the next commercial: initial step width in seconds (refined by factor 10 down to single frames); limited to the value of 'pause' so that no commercial break can be skipped
cut_window=Seeking with the black border: after the border has been found, look this many frames back for a hard cut and move the result onto it (0 = off). The border changes a little later than the picture.
overlay_opacity=Station logo: how strongly the red areas show, in percent: the rectangle of the DeLogo filter over the preview and the band in the RemoveLogo dialog (0 = only the edge, 100 = solid red); applies at once
path_map=Batch file: replaces the beginning of the source paths in the ffmpeg call, "source=target;source=target". A * in a source stands for any characters except /, e.g. /run/user/*/kio-fuse-*/smb/root@nas/Harddisk=/mnt/nas/Harddisk
batch=Batch: file the batch script is written to; a leading ~ is your home folder (empty: MediaMaker.sh in your home folder); applies at once
player=Preview: memory = VLC decodes into memory and Qt draws the pictures (runs natively under Wayland), embed = VLC draws into its own X11 window (XWayland); takes effect at the next start
vlc_args=Preview: additional arguments for libvlc, separated by spaces, e.g. --vout=xcb_x11; takes effect at the next start
hide_messages=Console: messages containing one of these texts are not shown, separated by | (the harmless messages of VDPAU, Wayland and the KDE file dialog are always hidden); takes effect at the next start
dialog_style=Dialogs with several pages (options, Media info): tabs = tabs along the top, list = list of the pages on the left; applies at once
file_dialog=File dialog of Save as MP4/AVI: qt = Qt's own dialog (a double click on an existing file saves it; the folders used recently are among its places), native = the dialog of your desktop (in some KDE setups a double click on an existing file did nothing there); applies at once
sessions_dir=Sessions (File => Backup session): folder with the saved sessions; a leading ~ is your home folder (empty: the folder 'sessions' next to the INI file); applies at once
vlc=Tools: path of the VLC program that plays the clip of Edit => Analyze cut point; empty: searched in the PATH, then the standard player of the desktop; applies at once
logo_edge=Logo detection (advanced): min. grey level difference of neighbouring pixels that counts as an edge
logo_conf=Logo detection (advanced): min. confidence (0 to 1) for the logo to count as present: the share of the reference edges that is found, minus logo_extra times the density of other edges
cut_diff=Seeking with the black border (advanced): min. mean difference (0 to 255) between two frames to count as a hard cut
cutpoint_length=Analyze cut point: length of the clip in seconds (2 to 120); it is made of the last half of the selected segment and the first half of the next one: 6 = 3 seconds each; applies at once
known_files=Frame counting: how many files whose frames have been counted are remembered in the INI section [known_files] (name of the file without the folder and its size in bytes = frames, frames before the first keyframe that cannot be shown, time of the first keyframe), so that the long counting of a big file on a network drive is not repeated; the oldest entries are dropped; 0 = remember nothing; applies at once
cutpoint_filters=Analyze cut point: on = the clip is made with all the filters that Save As applies (cropping, scaling, DeLogo, RemoveLogo); off = without cropping and logo filters (only scaled to the profile), with a note in the picture; applies at once
dedup=Max. number of frames examined during duplicate scene removal search (menu Edit => Dedup scene)
restore_backup=Restore session: on = the check box "Save the current state as a session first" is ticked when the window opens; the program remembers your last choice here (the other two check boxes are ticked every time); applies at once
copy_mode_notice=Copy mode: on = the warning that copy mode has been switched on again (at the start of the program, when a session is restored and when a job is imported from the batch file) is shown, with the check box "Show this warning next time"; off = it is not shown any more (the check box switches this off); applies at once
paused_preview=Preview while the film is stopped (player = memory only): vlc = VLC jumps to the slider position (it can get stuck after about ten jumps); ffmpeg = the pictures are read by ffmpeg (frame exact, with the same frame numbers as the thumbnails; a little slower, a picture follows the slider with a short delay); Play then jumps VLC to the shown position; applies at once
multitrack=When set to on, a multitrack selection dialog opens after the name of the file has been chosen (only if the source has more than one audio track or any subtitle track), allowing to choose and configure how the audio and/or subtitle track(s) should be processed.
terminal=Tools: command that opens a terminal window for Run now? of the batch script (the script is appended), e.g. konsole --separate -e; empty: konsole, gnome-terminal, xfce4-terminal, mate-terminal, lxterminal, kitty, alacritty or xterm is used, whichever is installed; applies at once
search_pictures=Seeking: on = while a search (end of commercial, next commercial) runs, the preview shows the picture of every frame that the search reads, like a film that runs by (these pictures are read anyway, the search is not slower; player = memory only); off = the preview stays as it is until the search is over; applies at once
logo_extra=Logo detection (advanced): weight (0 to 5) of the edges in the logo rectangle that are NOT in the reference logo; 1.0 = a picture with many edges (fine stripes, textures) does not count as the logo any more; 0 = only the share of the reference edges that is found, as before (then a picture with many edges can reach a confidence of 0.7 without the logo)
